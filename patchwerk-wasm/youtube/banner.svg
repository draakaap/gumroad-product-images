<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11161d"/>
      <stop offset="100%" stop-color="#05080b"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="35%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.65)"/>
    </radialGradient>
    <filter id="wordmarkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="2560" height="1440" fill="url(#bg)"/>

  <!-- Module faceplate silhouettes (outer thirds, dim) -->
  <g opacity="0.13" fill="#3f6f8c">
    <rect x="60"   y="900" width="240" height="320" rx="8"/>
    <rect x="320"  y="940" width="320" height="280" rx="8"/>
    <rect x="660"  y="900" width="180" height="320" rx="8"/>
    <rect x="1880" y="940" width="200" height="280" rx="8"/>
    <rect x="2100" y="900" width="280" height="320" rx="8"/>
    <rect x="2400" y="940" width="120" height="280" rx="8"/>
  </g>

  <!-- Knob marks on the silhouettes -->
  <g opacity="0.5" fill="#7da4c4">
    <circle cx="180"  cy="1060" r="22"/>
    <circle cx="480"  cy="1080" r="22"/>
    <circle cx="750"  cy="1060" r="22"/>
    <circle cx="1980" cy="1080" r="22"/>
    <circle cx="2240" cy="1060" r="22"/>
  </g>

  <!-- Sweeping cables across the whole width -->
  <g fill="none" stroke-width="7" stroke-linecap="round" opacity="0.75">
    <path d="M 0 840  Q 800 540 1280 720 T 2560 840"  stroke="#9af5b0"/>
    <path d="M 0 1000 Q 700 720 1280 880 T 2560 960"  stroke="#5fb3e0"/>
    <path d="M 0 1120 Q 900 820 1280 1020 T 2560 1080" stroke="#f5d76e" stroke-dasharray="14 10"/>
  </g>

  <!-- Wordmark — safe-area centre, with glow -->
  <text x="1280" y="640"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="220" font-weight="700"
        fill="#a0d4ff"
        text-anchor="middle"
        letter-spacing="20"
        opacity="0.45"
        filter="url(#wordmarkGlow)">
    PATCHWERK
  </text>
  <text x="1280" y="640"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="220" font-weight="700"
        fill="#a0d4ff"
        text-anchor="middle"
        letter-spacing="20">
    PATCHWERK
  </text>

  <!-- Tagline -->
  <text x="1280" y="750"
        font-family="ui-sans-serif, system-ui, -apple-system, sans-serif"
        font-size="44" font-weight="400"
        fill="#7da4c4"
        text-anchor="middle"
        letter-spacing="10">
    generative modular — patched in your browser
  </text>

  <!-- Handle (bottom-right, desktop-only zone) -->
  <text x="2480" y="1380"
        font-family="ui-monospace, monospace"
        font-size="32" fill="#5d7886"
        text-anchor="end"
        letter-spacing="3">
    @patchwerk
  </text>

  <!-- Edge vignette -->
  <rect width="2560" height="1440" fill="url(#vignette)"/>
</svg>
