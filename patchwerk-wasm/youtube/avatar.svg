<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bg" cx="0.4" cy="0.35" r="0.95">
      <stop offset="0%" stop-color="#1a232e"/>
      <stop offset="60%" stop-color="#0e1419"/>
      <stop offset="100%" stop-color="#05080b"/>
    </radialGradient>
    <radialGradient id="knob" cx="0.32" cy="0.28" r="0.95">
      <stop offset="0%" stop-color="#d4d8dc"/>
      <stop offset="45%" stop-color="#5b7186"/>
      <stop offset="100%" stop-color="#1a232e"/>
    </radialGradient>
    <linearGradient id="cable" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#9af5b0"/>
      <stop offset="100%" stop-color="#5fb3e0"/>
    </linearGradient>
    <filter id="tickGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Patch cable arcing behind the knob -->
  <path d="M 110 620 Q 400 420 690 620"
        stroke="url(#cable)" stroke-width="16" fill="none"
        stroke-linecap="round" opacity="0.85"/>
  <circle cx="110" cy="620" r="14" fill="#9af5b0"/>
  <circle cx="690" cy="620" r="14" fill="#5fb3e0"/>

  <!-- Knob body -->
  <circle cx="400" cy="400" r="240" fill="url(#knob)"
          stroke="#0e1419" stroke-width="14"/>
  <!-- Brushed-aluminium highlight -->
  <ellipse cx="340" cy="320" rx="120" ry="40" fill="#ffffff" opacity="0.08"/>

  <!-- Tick mark glow + body -->
  <rect x="390" y="180" width="20" height="100" fill="#a0d4ff" rx="5"
        filter="url(#tickGlow)" opacity="0.7"/>
  <rect x="390" y="180" width="20" height="100" fill="#a0d4ff" rx="5"/>

  <!-- Centre dot -->
  <circle cx="400" cy="400" r="14" fill="#0e1419"/>
</svg>
